title: 🌸 競プロメモ
markdown: kramdown
permalink: pretty
url: "https://cp.luny.dev"
baseurl: ""
collections:
  codeforces:
    output: true
    permalink: /codeforces/:path
  atcoder:
    output: true
    permalink: /atcoder/:path
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "codeforces"
      type: "codeforces"
    values:
      platform: "Codeforces"
  - scope:
      path: "atcoder"
      type: "atcoder"
    values:
      platform: "AtCoder"
